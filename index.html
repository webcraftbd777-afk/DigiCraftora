<section id="booking"><div class="wrap">
  <h2 data-i18n="book"></h2>
  <form id="bf" novalidate>
    <label><span data-i18n="fName"></span><input id="name" name="name" autocomplete="name" required aria-describedby="e-name"><span class="err" id="e-name"></span></label>
    <label><span data-i18n="fPhone"></span><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required aria-describedby="e-phone"><span class="err" id="e-phone"></span></label>
    <label><span data-i18n="fSvc"></span><select id="service" name="service" required aria-describedby="e-service"></select><span class="err" id="e-service"></span></label>
    <div class="row">
      <label><span data-i18n="fDate"></span><input id="date" name="date" type="date" required aria-describedby="e-date"><span class="err" id="e-date"></span></label>
      <label><span data-i18n="fTime"></span><input id="time" name="time" type="time" required aria-describedby="e-time"><span class="err" id="e-time"></span></label>
    </div>
    <label><span data-i18n="fMsg"></span><textarea id="message" name="message" rows="3"></textarea></label>
    <button class="btn" type="submit" data-i18n="submit"></button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
